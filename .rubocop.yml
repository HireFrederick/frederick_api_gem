# Run rubocop --auto-gen-config to generate .rubocop_todo.yml
# Run rubocop --auto-correct to have rubocop auto fix all offenses (Use this feature carefully!)
# Enable rubocop todos to go through them one by one
# For how to get started with rubocop, see: https://buildtoship.com/integrate-rubocop-in-your-workflow/

plugins:
  - rubocop-rspec

AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.3.10
  # Cop names are not displayed in offense messages by default. Change behavior
  # by overriding DisplayCopNames, or by giving the -D/--display-cop-names
  # option.
  DisplayCopNames: true
  # Style guide URLs are not displayed in offense messages by default. Change
  # behavior by overriding DisplayStyleGuide, or by giving the
  # -S/--display-style-guide option.
  DisplayStyleGuide: true
  # Exclude certain files
  Exclude:
    - 'vendor/**/*'
    - 'db/**/*'
    - 'tmp/**/*'
    - 'bin/**/*'
    - 'log/**/*'
    - 'client/**/*'
    - 'node_modules/**/*'

################################## Style ##################################

# Enable, Disable, and Edit styles below
# Default rubocop styles can be found at https://github.com/bbatsov/rubocop/blob/master/config/default.yml
# Copy styles from above url or .rubocop_todo.yml and only change specific rules (suggest using comments from both)

Metrics/AbcSize:
  Max: 20

RSpec/NestedGroups:
  Max: 6

# Configuration parameters: CountComments.
Metrics/MethodLength:
  Max: 20

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

Layout/MultilineMethodCallIndentation:
  Exclude:
    - 'spec/**/*'

# Checks the indentation of the first element in an array literal.
Layout/FirstArrayElementIndentation:
  Enabled: false

# Cop supports --auto-correct.
# Configuration parameters: AllowIfMethodIsEmpty.
Style/SingleLineMethods:
  Enabled: false

# Cop supports --auto-correct.
# Configuration parameters: EnforcedStyle, SupportedStyles, IndentationWidth.
# SupportedStyles: aligned, indented
Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

Layout/IndentationConsistency:
  EnforcedStyle: indented_internal_methods

# Document classes and non-namespace modules.
Style/Documentation:
  Exclude:
    - 'spec/**/*'
    - 'config/*'
    - 'config/locales/*'

# Cop supports --auto-correct.
# Configuration parameters: AllowUnusedKeywordArguments, IgnoreEmptyMethods.
Layout/EmptyLinesAroundAccessModifier:
  Enabled: false

# Cop supports --auto-correct.
Style/RedundantSelf:
  Enabled: false

# Configuration parameters: EnforcedStyle, SupportedStyles.
# SupportedStyles: nested, compact
Style/ClassAndModuleChildren:
  Enabled: false

# Check that instances are not being stubbed globally
RSpec/AnyInstance:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false


################################## EXCLUDED ##################################

Naming/AccessorMethodName:
  Exclude:
    - 'app/controllers/api/v1/api_controller.rb'

RSpec/MultipleDescribes:
  Exclude:
    - 'spec/controllers/api/v1/api_controller_spec.rb'

Lint/UnusedMethodArgument:
  Exclude:
    - 'config/initializers/sidekiq.rb'
    - 'app/controllers/application_controller.rb'

RSpec/DescribeClass:
  Exclude:
    - 'spec/lib/tasks/**/*'
    - 'spec/integration/*.rb'

RSpec/DescribedClass:
  Exclude:
    - '**/*'

Style/TrailingCommaInArrayLiteral:
  Exclude:
    - 'spec/**/*'
    - 'app/**/*'
    - '**/*'

Style/TrailingCommaInHashLiteral:
  Exclude:
    - 'spec/**/*'
    - 'app/**/*'
    - '**/*'

Style/TrailingCommaInArguments:
  Exclude:
    - 'spec/**/*'
    - 'app/**/*'
    - '**/*'

Style/FrozenStringLiteralComment:
  Exclude:
    - 'app/views/*'

RSpec/MessageExpectation:
  Exclude:
    - 'spec/**/*'

RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/**/*'

RSpec/SpecFilePathSuffix:
  Exclude:
    - 'spec/**/*'

RSpec/MultipleExpectations:
  Exclude:
    - 'spec/**/*'

RSpec/ExampleLength:
  Exclude:
    - 'spec/**/*'
    - '**/*'

Metrics/ModuleLength:
  Exclude:
    - '**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

RSpec/MessageSpies:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

RSpec/ExpectInHook:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/RepeatedExampleGroupBody:
  Enabled: false

RSpec/RepeatedExampleGroupDescription:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

RSpec/IndexedLet:
  Enabled: false

RSpec/IdenticalEqualityAssertion:
  Enabled: false

Naming/VariableNumber:
  Exclude:
    - 'spec/**/*'
